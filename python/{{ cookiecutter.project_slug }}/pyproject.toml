[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
authors = [
  { name = "{{ cookiecutter.author_name }}", email = "{{ cookiecutter.author_email }}" },
]
description = "{{ cookiecutter.description }}"
readme = "README.md"
requires-python = ">={{ cookiecutter.python_version }}"
{% if cookiecutter.license != "None" %}
license = "{{ cookiecutter.license }}"
license-files = ["LICENSE-*"]
{% endif %}
dependencies = [
{% if cookiecutter.project_type == "cli" %}
  "typer>=0.21",
{% endif %}
]

{% if cookiecutter.project_type == "cli" %}
[project.scripts]
{{ cookiecutter.project_slug }} = "{{ cookiecutter.__package_name }}.cli:app"
{% endif %}

[dependency-groups]
dev = [
  "basedpyright>=1.31",
{% if cookiecutter.include_pre_commit %}
  "pre-commit>=4.0",
{% endif %}
  "pytest>=8.3",
  "ruff>=0.15",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{ cookiecutter.__package_name }}"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "{{ cookiecutter.__ruff_target_version }}"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "{{ cookiecutter.python_version }}"
typeCheckingMode = "strict"
